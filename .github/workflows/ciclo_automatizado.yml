name: Ciclo 30T Intradia

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 08:00 Mexico - Pre-mercado
    - cron: '0 16 * * 1-5'   # 11:00 Mexico - Media manana
    - cron: '0 19 * * 1-5'   # 14:00 Mexico - Media tarde
    - cron: '0 21 * * 1-5'   # 16:00 Mexico - Post-mercado
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Python
        shell: bash
        run: pip install yfinance beautifulsoup4 lxml -q

      - name: Obtener precios reales (yfinance + scraping)
        shell: bash
        run: python fetch_prices.py

      - name: Explorar mercados globales (construir universo desde Wikipedia)
        shell: bash
        run: python explorar_mercados.py

      - name: Cobertura global (screening tecnico masivo + filtro top 50)
        shell: bash
        run: python cobertura_global.py

      - name: Noticias de mercado (RSS + sentimiento IA)
        shell: bash
        run: python noticias_mercado.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Analisis tecnico (indicadores + regimen de mercado)
        shell: bash
        run: python analisis_tecnico.py

      - name: Analisis IA via OpenRouter (ensemble multi-modelo + noticias + tecnicos)
        shell: bash
        run: python analisis_ia.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Evaluar predicciones y calibrar (aprendizaje autonomo)
        shell: bash
        run: python aprendizaje.py

      - name: Ejecutar ciclo intradia (30 tickers)
        shell: pwsh
        run: ./ciclo_gh.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Commit y push de cambios
        shell: bash
        run: |
          git config --global user.name "Agente IA Bot"
          git config --global user.email "agente-ia@bot.local"
          git add -A
          git diff --cached --quiet || (git commit -m "[auto] 30T $(date +'%Y-%m-%d %H:%M')" && git pull --rebase && git push)

      - name: Preparar artefacto para Pages
        shell: bash
        run: |
          mkdir -p _site
          cp -r Reportes/* _site/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./dashboard_top15.html"></head><body><a href="./dashboard_top15.html">Dashboard</a></body></html>' > _site/index.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3

      - name: Desplegar a GitHub Pages
        uses: actions/deploy-pages@v4
