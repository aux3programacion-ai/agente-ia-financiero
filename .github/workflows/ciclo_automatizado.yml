name: Ciclo Automatico 08:00 y 16:00

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar ciclo de analisis
        shell: pwsh
        run: ./ciclo_gh.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Commit y push de cambios
        shell: bash
        run: |
          git config --global user.name "Agente IA Bot"
          git config --global user.email "agente-ia@bot.local"
          git add -A
          git diff --cached --quiet || git commit -m "[auto] Ciclo $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Preparar artefacto para Pages
        shell: bash
        run: |
          mkdir -p _site
          cp -r Reportes/* _site/
          # Crear index.html que redirige al dashboard
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./dashboard_top15.html"></head><body><a href="./dashboard_top15.html">Ir al Dashboard</a></body></html>' > _site/index.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3

      - name: Desplegar a GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
