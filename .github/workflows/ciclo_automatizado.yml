name: Ciclo 30T Intradia

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 08:00 Mexico - Pre-mercado
    - cron: '0 15 * * 1-5'   # 10:00 Mexico
    - cron: '0 17 * * 1-5'   # 12:00 Mexico
    - cron: '0 19 * * 1-5'   # 14:00 Mexico - Media tarde
    - cron: '0 21 * * 1-5'   # 16:00 Mexico - Post-mercado
    - cron: '0 22 * * 1-5'   # 17:00 Mexico - Cierre
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Python
        shell: bash
        run: pip install yfinance beautifulsoup4 lxml xgboost scikit-learn numpy pandas requests lightgbm catboost optuna -q

      - name: Instalar Playwright y Chromium
        shell: bash
        run: |
          pip install playwright -q
          python -m playwright install --with-deps chromium 2>&1 | tail -3

      - name: Obtener precios reales (yfinance + scraping)
        shell: bash
        run: python fetch_prices.py

      - name: Explorar mercados globales (construir universo desde Wikipedia)
        shell: bash
        run: python explorar_mercados.py

      - name: Cobertura global (screening tecnico masivo + filtro top 50)
        shell: bash
        run: python cobertura_global.py

      - name: Noticias de mercado (RSS + sentimiento IA)
        shell: bash
        run: python noticias_mercado.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Google Finance (estadisticas clave, beta, 52w, earnings, relacionados)
        shell: bash
        run: python google_finance_scraper.py

      - name: TIKR Terminal (ownership, noticias, ratios, estimaciones, valoracion)
        shell: bash
        continue-on-error: true
        run: python tikr_scraper.py
        env:
          TIKR_EMAIL: ${{ secrets.TIKR_EMAIL }}
          TIKR_PASSWORD: ${{ secrets.TIKR_PASSWORD }}

      - name: Analisis tecnico (indicadores + regimen de mercado)
        shell: bash
        run: python analisis_tecnico.py

      - name: Analisis IA via OpenRouter (ensemble multi-modelo + noticias + tecnicos)
        shell: bash
        run: python analisis_ia.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Calendario economico (Fed, CPI, NFP, earnings)
        shell: bash
        run: python calendario_economico.py

      - name: Macro Features (FRED, VIX, yields, DXY)
        shell: bash
        run: python macro_features.py
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}

      - name: Analisis de riesgo (VaR, Sharpe, drawdown, correlacion)
        shell: bash
        run: python analisis_riesgo.py

      - name: Patrones tecnicos (velas, divergencias, soporte/resistencia)
        shell: bash
        run: python analisis_patrones.py

      - name: Sentimiento redes (Reddit, social media)
        shell: bash
        run: python analisis_social.py

      - name: Modelo predictivo XGBoost (+ sklearn)
        shell: bash
        run: python modelo_xgboost.py

      - name: Explicabilidad SHAP (factores que influyen en cada prediccion)
        shell: bash
        run: python explicabilidad.py

      - name: Regimen de mercado (HMM, tendencia, volatilidad)
        shell: bash
        run: python regimen_mercado.py

      - name: Dividendos, SEC filings, insider trading, opciones, earnings quality
        shell: bash
        run: |
          python dividendos.py
          python sec_filings.py
          python insider_trading.py
          python opciones.py
          python earnings_quality.py

      - name: Auto Feature Engineering (interacciones, transformaciones, agregados)
        shell: bash
        continue-on-error: true
        run: python auto_feature_engineering.py

      - name: Analisis avanzados (short interest, analyst ratings, on-chain, sector momentum)
        shell: bash
        continue-on-error: true
        run: |
          python short_interest.py
          python analyst_ratings.py
          python sector_momentum.py
          python surprise_index.py
          python onchain_data.py

      - name: NLP avanzado (Fed speeches, earnings calls)
        shell: bash
        continue-on-error: true
        run: python central_bank_nlp.py

      - name: Factor Attribution y Concentration Risk
        shell: bash
        continue-on-error: true
        run: |
          python factor_attribution.py
          python concentration_risk.py

      - name: Liquidity Scoring
        shell: bash
        continue-on-error: true
        run: python liquidity_score.py

      - name: Online Learning (SGD incremental)
        shell: bash
        continue-on-error: true
        run: python online_learning.py

      - name: Drawdown Stop System
        shell: bash
        continue-on-error: true
        run: python drawdown_stop.py

      - name: Optimizacion de portafolio (Markowitz, risk parity, HRP, tax-aware, Monte Carlo, stress test)
        shell: bash
        run: python optimizacion_portafolio.py

      - name: Paper trading (simulacion de compra/venta)
        shell: bash
        run: python paper_trading.py

      - name: Broker API status (Paper-to-Live Bridge)
        shell: bash
        continue-on-error: true
        run: python broker_api.py
        env:
          BROKER_MODE: ${{ secrets.BROKER_MODE || 'paper' }}
          BROKER: ${{ secrets.BROKER || 'ibkr' }}
          IBKR_HOST: ${{ secrets.IBKR_HOST || '127.0.0.1' }}
          IBKR_PORT: ${{ secrets.IBKR_PORT || '7497' }}
          IBKR_CLIENT_ID: ${{ secrets.IBKR_CLIENT_ID || '1' }}
          ALPACA_KEY: ${{ secrets.ALPACA_KEY || '' }}
          ALPACA_SECRET: ${{ secrets.ALPACA_SECRET || '' }}

      - name: Evaluar predicciones y calibrar (aprendizaje autonomo)
        shell: bash
        run: python aprendizaje.py

      - name: Skill Memory (aprendizaje de patrones exitosos)
        shell: bash
        continue-on-error: true
        run: python aprendizaje_skills.py

      - name: Auto-Evolution (few-shot, hipotesis, auto-prompt, fine-tune simulado)
        shell: bash
        continue-on-error: true
        run: python auto_evolution.py

      - name: Auto Feature Discovery (LLM escribe nuevas features)
        shell: bash
        continue-on-error: true
        run: python auto_feature_discovery.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Ablation Studio (mide impacto de cada optimizacion)
        shell: bash
        continue-on-error: true
        run: python ablation_studio.py

      - name: Ejecutar ciclo intradia (30 tickers)
        shell: pwsh
        run: ./ciclo_gh.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Commit y push de cambios
        shell: bash
        run: |
          git config --global user.name "Agente IA Bot"
          git config --global user.email "agente-ia@bot.local"
          git add -A
          git diff --cached --quiet || (git commit -m "[auto] 30T $(date +'%Y-%m-%d %H:%M')" && git pull --rebase && git push)

      - name: Preparar artefacto para Pages
        shell: bash
        run: |
          mkdir -p _site
          cp -r Reportes/* _site/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./dashboard_top15.html"></head><body><a href="./dashboard_top15.html">Dashboard</a></body></html>' > _site/index.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3

      - name: Desplegar a GitHub Pages
        uses: actions/deploy-pages@v4
