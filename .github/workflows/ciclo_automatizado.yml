name: Ciclo 30T Intradia

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 08:00 Mexico - Pre-mercado
    - cron: '0 15 * * 1-5'   # 10:00 Mexico
    - cron: '0 17 * * 1-5'   # 12:00 Mexico
    - cron: '0 19 * * 1-5'   # 14:00 Mexico - Media tarde
    - cron: '0 21 * * 1-5'   # 16:00 Mexico - Post-mercado
    - cron: '0 22 * * 1-5'   # 17:00 Mexico - Cierre
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Instalar dependencias Python
        shell: bash
        run: pip install yfinance beautifulsoup4 lxml xgboost scikit-learn numpy pandas requests playwright -q

      - name: Instalar Chromium para Playwright
        shell: bash
        run: playwright install chromium

      - name: Obtener precios reales (yfinance + scraping)
        shell: bash
        run: python fetch_prices.py

      - name: Explorar mercados globales (construir universo desde Wikipedia)
        shell: bash
        run: python explorar_mercados.py

      - name: Cobertura global (screening tecnico masivo + filtro top 50)
        shell: bash
        run: python cobertura_global.py

      - name: Noticias de mercado (RSS + sentimiento IA)
        shell: bash
        run: python noticias_mercado.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Google Finance (estadisticas clave, beta, 52w, earnings, relacionados)
        shell: bash
        run: python google_finance_scraper.py

      - name: TIKR Terminal (ownership, noticias, ratios, estimaciones, valoracion)
        shell: bash
        run: python tikr_scraper.py
        env:
          TIKR_EMAIL: ${{ secrets.TIKR_EMAIL }}
          TIKR_PASSWORD: ${{ secrets.TIKR_PASSWORD }}

      - name: Analisis tecnico (indicadores + regimen de mercado)
        shell: bash
        run: python analisis_tecnico.py

      - name: Analisis IA via OpenRouter (ensemble multi-modelo + noticias + tecnicos)
        shell: bash
        run: python analisis_ia.py
        env:
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}

      - name: Calendario economico (Fed, CPI, NFP, earnings)
        shell: bash
        run: python calendario_economico.py

      - name: Analisis de riesgo (VaR, Sharpe, drawdown, correlacion)
        shell: bash
        run: python analisis_riesgo.py

      - name: Patrones tecnicos (velas, divergencias, soporte/resistencia)
        shell: bash
        run: python analisis_patrones.py

      - name: Sentimiento redes (Reddit, social media)
        shell: bash
        run: python analisis_social.py

      - name: Modelo predictivo XGBoost (+ sklearn)
        shell: bash
        run: python modelo_xgboost.py

      - name: Explicabilidad SHAP (factores que influyen en cada prediccion)
        shell: bash
        run: python explicabilidad.py

      - name: Regimen de mercado (HMM, tendencia, volatilidad)
        shell: bash
        run: python regimen_mercado.py

      - name: Dividendos, SEC filings, insider trading, opciones
        shell: bash
        run: |
          python dividendos.py
          python sec_filings.py
          python insider_trading.py
          python opciones.py

      - name: Optimizacion de portafolio (Markowitz, risk parity, Monte Carlo, stress test)
        shell: bash
        run: python optimizacion_portafolio.py

      - name: Paper trading (simulacion de compra/venta)
        shell: bash
        run: python paper_trading.py

      - name: Broker API status
        shell: bash
        run: python broker_api.py

      - name: Evaluar predicciones y calibrar (aprendizaje autonomo)
        shell: bash
        run: python aprendizaje.py

      - name: Ejecutar ciclo intradia (30 tickers)
        shell: pwsh
        run: ./ciclo_gh.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Commit y push de cambios
        shell: bash
        run: |
          git config --global user.name "Agente IA Bot"
          git config --global user.email "agente-ia@bot.local"
          git add -A
          git diff --cached --quiet || (git commit -m "[auto] 30T $(date +'%Y-%m-%d %H:%M')" && git pull --rebase && git push)

      - name: Preparar artefacto para Pages
        shell: bash
        run: |
          mkdir -p _site
          cp -r Reportes/* _site/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./dashboard_top15.html"></head><body><a href="./dashboard_top15.html">Dashboard</a></body></html>' > _site/index.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3

      - name: Desplegar a GitHub Pages
        uses: actions/deploy-pages@v4
