name: Ciclo Automatico 08:00 y 16:00

on:
  schedule:
    - cron: '0 13 * * *'
    - cron: '0 21 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar ciclo de analisis
        shell: pwsh
        run: ./ciclo_gh.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Commit y push de cambios
        shell: bash
        run: |
          git config --global user.name "Agente IA Bot"
          git config --global user.email "agente-ia@bot.local"
          git add -A
          git diff --cached --quiet || git commit -m "[auto] Ciclo $(date +'%Y-%m-%d %H:%M')"
          git push
