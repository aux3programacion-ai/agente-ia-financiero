name: Ciclo 30T Intradia

on:
  schedule:
    - cron: '0 13 * * 1-5'   # 08:00 Mexico - Pre-mercado
    - cron: '0 16 * * 1-5'   # 11:00 Mexico - Media manana
    - cron: '0 19 * * 1-5'   # 14:00 Mexico - Media tarde
    - cron: '0 21 * * 1-5'   # 16:00 Mexico - Post-mercado
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  analisis:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar ciclo intradia (30 tickers)
        shell: pwsh
        run: ./ciclo_gh.ps1
        env:
          GITHUB_WORKSPACE: ${{ github.workspace }}

      - name: Commit y push de cambios
        shell: bash
        run: |
          git config --global user.name "Agente IA Bot"
          git config --global user.email "agente-ia@bot.local"
          git add -A
          git diff --cached --quiet || git commit -m "[auto] 30T $(date +'%Y-%m-%d %H:%M')"
          git push

      - name: Preparar artefacto para Pages
        shell: bash
        run: |
          mkdir -p _site
          cp -r Reportes/* _site/
          echo '<!DOCTYPE html><html><head><meta http-equiv="refresh" content="0;url=./dashboard_top15.html"></head><body><a href="./dashboard_top15.html">Dashboard</a></body></html>' > _site/index.html

      - name: Subir artefacto
        uses: actions/upload-pages-artifact@v3

      - name: Desplegar a GitHub Pages
        uses: actions/deploy-pages@v4
